name: Publish to npm

# Trigger only when code is pushed to main branch
on:
  push:
    branches:
      - main

# Restrict permissions to minimum required for security
permissions:
  contents: read

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read # Only need to read repository contents

    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js with caching for npm dependencies
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*' # Use latest LTS version of Node.js
          registry-url: 'https://registry.npmjs.org' # Configure npm registry

      # Cache npm dependencies to speed up subsequent runs
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # Install dependencies using clean install for reproducible builds
      - name: Install dependencies
        run: npm ci

      # Run tests to ensure package is in working state
      - name: Run tests
        run: npm test

      # Build the package (compile TypeScript, generate bundles and types)
      - name: Build package
        run: npm run build

      # Check if version already exists on npm registry to avoid republishing
      - name: Check if version exists on npm
        id: check-version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME already exists on npm."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Version $PACKAGE_VERSION of $PACKAGE_NAME does not exist on npm. Proceeding with publish."
          fi

      # Publish to npm if version doesn't already exist
      - name: Publish to npm
        if: steps.check-version.outputs.exists == 'false'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          # Check if package is scoped (starts with @) and publish with public access if needed
          if [[ "$PACKAGE_NAME" == @* ]]; then
            npm publish --access public
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # Use npm token from GitHub Secrets
