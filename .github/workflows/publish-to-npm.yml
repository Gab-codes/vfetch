name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure compatible npm version
        run: |
          npm install --global npm@^11.5.1
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check coverage
        run: npm run coverage

      - name: Build package
        run: npm run build

      - name: Check if version exists on npm
        id: check-version
        shell: bash
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          set +e
          OUTPUT=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>&1)
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $PACKAGE_VERSION already exists on npm."
          elif echo "$OUTPUT" | grep -q 'E404'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version $PACKAGE_VERSION is not published yet."
          else
            echo "$OUTPUT"
            echo "Unable to verify the package version."
            exit "$STATUS"
          fi

      - name: Publish to npm
        if: steps.check-version.outputs.exists == 'false'
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          if [[ "$PACKAGE_NAME" == @* ]]; then
            npm publish --access public
          else
            npm publish
          fi
